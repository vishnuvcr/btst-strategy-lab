data:
  intraday_glob: "data/intraday/**/*.csv"
  start_date: "2015-01-01"
  end_date: "2026-09-14"
  max_symbols: 1000
  min_bars_per_day: 70
  min_price: 20
research:
  train_days: 504
  validation_days: 63
  test_days: 63
  step_days: 63
  sample_per_fold: 150000
  n_clusters: [4, 6, 8, 10]
  random_state: 42
  min_signal_obs: 200
  horizons_bars: [6, 12, 24]
  max_estimators: 250
costs:
  slippage_bps_per_side: 2.0
  transaction_cost_bps_per_side: 3.0
portfolio:
  max_positions: 10
  max_gross_exposure: 0.95
execution:
  stop_atr: 1.5
  target_atr: 2.5
  max_holding_bars: 24
