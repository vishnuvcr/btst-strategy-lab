name: Intraday Meta v2 Research
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [intraday-unsupervised-meta]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Preflight
        run: |
          python -m py_compile src/intraday_meta_v2.py
          test -s config/intraday_meta_v2.yaml
      - name: Download genuine intraday data
        run: python scripts/download_data.py
      - name: Verify dataset
        run: |
          n=$(find data/intraday -type f -name '*.csv' | wc -l)
          echo "Intraday CSV files: $n"
          test "$n" -gt 0
      - name: Run v2 research
        run: python src/intraday_meta_v2.py --config config/intraday_meta_v2.yaml
      - name: Validate outputs
        run: |
          test -s docs/intraday_meta_v2_metrics.csv
          test -s docs/intraday_meta_v2_oos.csv
          test -s docs/intraday_meta_v2_folds.csv
          python - <<'PY'
          import pandas as pd
          p=pd.read_csv('docs/intraday_meta_v2_metrics.csv')
          print(p.to_string(index=False))
          assert not p.empty
          assert (p['months_ge_30pct'] >= 0).all()
          PY
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: intraday-meta-v2-results
          path: docs/intraday_meta_v2_*.csv
          if-no-files-found: error
