name: NSE Daily Swing Research

on:
  workflow_dispatch:
  push:
    branches:
      - nse-swing-research

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax and tests
        run: |
          python -m compileall -q src scripts tests
          pytest -q

      - name: Download NSE-wide daily data
        run: python scripts/download_swing_data.py

      - name: Run NSE-wide swing tournament
        run: python src/swing_tournament.py --config config/swing.yaml

      - name: Validate swing artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          for p in ['docs/swing_strategy_leaderboard.csv','docs/swing_oos_trades.csv','docs/swing_research_manifest.json']:
              assert Path(p).is_file() and Path(p).stat().st_size > 0, p
          lb=pd.read_csv('docs/swing_strategy_leaderboard.csv')
          assert len(lb) == 42, f'Expected 42 strategy/horizon rows, got {len(lb)}'
          assert lb['trades'].ge(0).all()
          with open('docs/swing_research_manifest.json',encoding='utf-8') as f: m=json.load(f)
          assert m['symbols_tested'] > 0
          assert m['point_in_time_membership'] is False
          print(lb.to_string(index=False))
          print(json.dumps(m,indent=2))
          PY

      - name: Upload swing research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nse-swing-results
          path: |
            docs/swing_strategy_leaderboard.csv
            docs/swing_oos_trades.csv
            docs/swing_research_manifest.json

      - name: Commit swing research artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/swing_*.csv docs/swing_*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Auto: NSE swing research results'
          git push origin HEAD:nse-swing-research
