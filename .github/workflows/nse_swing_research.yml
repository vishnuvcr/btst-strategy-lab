name: NSE Daily Swing Research

on:
  workflow_dispatch:
  push:
    branches:
      - nse-swing-research

concurrency:
  group: nse-swing-research-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare-data:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax and tests
        run: |
          python -m compileall -q src scripts tests
          pytest -q

      - name: Download NSE-wide daily data
        run: |
          rm -rf data/nse_all_daily
          python scripts/download_swing_data.py

      - name: Validate downloaded NSE data
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          files=list(Path('data/nse_all_daily').rglob('*.csv'))
          assert files, 'No NSE CSV files were created'
          rows=0
          for p in files[:100]:
              df=pd.read_csv(p, nrows=5)
              cols={str(c).strip().lower() for c in df.columns}
              required={'date','open','high','low','close','volume','symbol'}
              assert required.issubset(cols), f'{p} missing required columns: {sorted(required-cols)}'
              rows += len(df)
          print(f'CSV files: {len(files)}; sampled files: {min(len(files),100)}; sampled rows: {rows}')
          assert len(files) >= 100, f'Unexpectedly small NSE dataset: {len(files)} files'
          PY

      - name: Upload shared NSE data
        uses: actions/upload-artifact@v4
        with:
          name: nse-daily-data
          path: data/nse_all_daily
          compression-level: 1
          retention-days: 3

  tournament:
    needs: prepare-data
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download shared NSE data
        uses: actions/download-artifact@v4
        with:
          name: nse-daily-data
          path: data/nse_all_daily
      - name: Run NSE-wide swing tournament
        run: python src/swing_tournament.py --config config/swing.yaml
      - name: Validate swing artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          for p in ['docs/swing_strategy_leaderboard.csv','docs/swing_oos_trades.csv','docs/swing_research_manifest.json']:
              assert Path(p).is_file() and Path(p).stat().st_size > 0, p
          lb=pd.read_csv('docs/swing_strategy_leaderboard.csv')
          assert len(lb) == 42, f'Expected 42 strategy/horizon rows, got {len(lb)}'
          assert lb['trades'].ge(0).all()
          with open('docs/swing_research_manifest.json',encoding='utf-8') as f: m=json.load(f)
          assert m['symbols_tested'] > 0
          assert m['point_in_time_membership'] is False
          print(lb.to_string(index=False))
          print(json.dumps(m,indent=2))
          PY
      - name: Upload tournament artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nse-swing-tournament
          path: |
            docs/swing_strategy_leaderboard.csv
            docs/swing_oos_trades.csv
            docs/swing_research_manifest.json

  selective:
    needs: prepare-data
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        horizon: [5, 10, 20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download shared NSE data
        uses: actions/download-artifact@v4
        with:
          name: nse-daily-data
          path: data/nse_all_daily
      - name: Run nested selective optimizer
        run: python src/selective_optimizer.py --config config/swing.yaml --horizon ${{ matrix.horizon }}
      - name: Namespace horizon artifacts
        run: |
          mv docs/selective_oos_summary.csv docs/selective_${{ matrix.horizon }}_oos_summary.csv
          mv docs/selective_fold_parameters.csv docs/selective_${{ matrix.horizon }}_fold_parameters.csv
          mv docs/selective_oos_trades.csv docs/selective_${{ matrix.horizon }}_oos_trades.csv
          mv docs/selective_research_manifest.json docs/selective_${{ matrix.horizon }}_research_manifest.json
      - name: Validate horizon artifacts
        env:
          H: ${{ matrix.horizon }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import pandas as pd
          h=os.environ['H']
          paths=[f'docs/selective_{h}_oos_summary.csv',f'docs/selective_{h}_fold_parameters.csv',f'docs/selective_{h}_oos_trades.csv',f'docs/selective_{h}_research_manifest.json']
          for p in paths:
              assert Path(p).is_file() and Path(p).stat().st_size > 0, p
          s=pd.read_csv(paths[0])
          assert set(s.horizon_days) == {int(h)}
          assert s.trades.ge(0).all()
          m=json.load(open(paths[3],encoding='utf-8'))
          assert m['candidate_count'] == 100
          assert m['point_in_time_membership'] is False
          print(s.to_string(index=False))
          print(json.dumps(m,indent=2))
          PY
      - name: Upload horizon optimization artifacts
        uses: actions/upload-artifact@v4
        with:
          name: selective-${{ matrix.horizon }}
          path: docs/selective_${{ matrix.horizon }}_*

  aggregate:
    needs: [tournament, selective]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download tournament artifacts
        uses: actions/download-artifact@v4
        with:
          name: nse-swing-tournament
          path: docs
      - name: Download selective horizon artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: selective-*
          path: docs
          merge-multiple: true
      - name: Aggregate and validate selective results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          docs=Path('docs')
          horizons=(5,10,20)
          summaries=[pd.read_csv(docs/f'selective_{h}_oos_summary.csv') for h in horizons]
          folds=[pd.read_csv(docs/f'selective_{h}_fold_parameters.csv') for h in horizons]
          trades=[pd.read_csv(docs/f'selective_{h}_oos_trades.csv') for h in horizons]
          manifests=[json.load(open(docs/f'selective_{h}_research_manifest.json',encoding='utf-8')) for h in horizons]
          assert all(m['candidate_count']==100 for m in manifests)
          assert all(m['point_in_time_membership'] is False for m in manifests)
          summary=pd.concat(summaries,ignore_index=True).sort_values(['sharpe','expectancy'],ascending=False)
          fold=pd.concat(folds,ignore_index=True).sort_values(['horizon_days','fold'])
          trade=pd.concat(trades,ignore_index=True).sort_values(['horizon','signal_date','symbol'])
          summary.to_csv(docs/'selective_oos_summary.csv',index=False)
          fold.to_csv(docs/'selective_fold_parameters.csv',index=False)
          trade.to_csv(docs/'selective_oos_trades.csv',index=False)
          manifest={
              'engine':'nse_daily_swing_selective_v4_distributed_horizons',
              'tuning':'nested validation-to-OOS',
              'horizons':list(horizons),
              'candidate_count':100,
              'exact_simulation_finalists_per_fold':5,
              'distributed_horizon_jobs':3,
              'selection_objective':'Sharpe + profit factor + win rate + expectancy + return - drawdown penalty',
              'survivorship_warning':True,
              'point_in_time_membership':False,
          }
          json.dump(manifest,open(docs/'selective_research_manifest.json','w',encoding='utf-8'),indent=2)
          print(summary.to_string(index=False))
          print(json.dumps(manifest,indent=2))
          PY
      - name: Upload combined research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nse-swing-results
          path: |
            docs/swing_strategy_leaderboard.csv
            docs/swing_oos_trades.csv
            docs/swing_research_manifest.json
            docs/selective_oos_summary.csv
            docs/selective_fold_parameters.csv
            docs/selective_oos_trades.csv
            docs/selective_research_manifest.json
