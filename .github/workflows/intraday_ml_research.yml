name: Intraday ML Research

on:
  workflow_dispatch:
  push:
    branches: [multi-method-research]

permissions:
  contents: read

timeout-minutes: 120

jobs:
  intraday-ml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download genuine intraday data
        run: python scripts/download_data.py

      - name: Verify intraday dataset
        run: |
          test -d data/intraday
          n=$(find data/intraday -type f -name '*.csv' | wc -l)
          echo "Intraday CSV files: $n"
          test "$n" -gt 0

      - name: Run walk-forward intraday ML tournament
        run: python src/intraday_ml_tournament.py --config config/intraday_ml.yaml

      - name: Validate artifacts
        run: |
          test -s docs/intraday_ml_leaderboard.csv
          test -s docs/intraday_ml_oos_trades.csv
          test -s docs/intraday_ml_monthly_returns.csv
          python - <<'PY'
          import pandas as pd
          lb = pd.read_csv('docs/intraday_ml_leaderboard.csv')
          if lb.empty:
              raise SystemExit('Empty leaderboard')
          required = {'strategy','trades','profit_factor','total_return','sharpe','max_drawdown'}
          missing = required - set(lb.columns)
          if missing:
              raise SystemExit(f'Missing leaderboard columns: {missing}')
          if (lb.trades <= 0).all():
              raise SystemExit('No strategy has OOS trades')
          print(lb.to_string(index=False))
          m = pd.read_csv('docs/intraday_ml_monthly_returns.csv')
          print('\nBest monthly return by method:')
          print(m.groupby('method').monthly_return.max().sort_values(ascending=False).head(10))
          PY

      - name: Upload intraday ML results
        uses: actions/upload-artifact@v4
        with:
          name: intraday-ml-results
          path: |
            docs/intraday_ml_leaderboard.csv
            docs/intraday_ml_oos_trades.csv
            docs/intraday_ml_monthly_returns.csv
          retention-days: 30
