name: Intraday Unsupervised Meta Research

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [intraday-unsupervised-meta]
    paths-ignore:
      - 'docs/intraday_unsupervised_meta_*.csv'

permissions:
  contents: read

jobs:
  intraday-unsupervised-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Preflight engine and config
        run: |
          python -m py_compile src/intraday_unsupervised_meta.py
          test -s config/intraday_unsupervised_meta.yaml
          echo "Ref: $GITHUB_REF"
          echo "SHA: $GITHUB_SHA"
          python - <<'PY'
          import yaml
          cfg = yaml.safe_load(open('config/intraday_unsupervised_meta.yaml', encoding='utf-8'))
          print('Research config:', cfg['research'])
          print('Portfolio config:', cfg['portfolio'])
          PY

      - name: Download genuine intraday data
        run: python scripts/download_data.py

      - name: Verify intraday dataset
        run: |
          test -d data/intraday
          n=$(find data/intraday -type f -name '*.csv' | wc -l)
          echo "Intraday CSV files: $n"
          test "$n" -gt 0

      - name: Run unsupervised intraday meta research
        run: python src/intraday_unsupervised_meta.py --config config/intraday_unsupervised_meta.yaml

      - name: Validate outputs
        run: |
          test -s docs/intraday_unsupervised_meta_metrics.csv
          test -s docs/intraday_unsupervised_meta_oos.csv
          test -s docs/intraday_unsupervised_meta_selection.csv
          python - <<'PY'
          import pandas as pd
          m = pd.read_csv('docs/intraday_unsupervised_meta_metrics.csv')
          if m.empty:
              raise SystemExit('Empty metrics')
          required = {'horizon','trades','total_return','cagr','sharpe','max_drawdown','best_month','worst_month','months_ge_30pct'}
          missing = required - set(m.columns)
          if missing:
              raise SystemExit(f'Missing metric columns: {missing}')
          if (m.trades <= 0).all():
              raise SystemExit('No OOS trades')
          print(m.to_string(index=False))
          PY

      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: intraday-unsupervised-meta-results
          path: |
            docs/intraday_unsupervised_meta_metrics.csv
            docs/intraday_unsupervised_meta_oos.csv
            docs/intraday_unsupervised_meta_selection.csv
          retention-days: 30
