name: BTST Strategy Research

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btst_research.yml'
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download daily and market data
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import yaml
          from scripts.download_data import download
          with open('config/btst.yaml') as f:
              c = yaml.safe_load(f)['data']['kaggle']
          download(c['nifty50_daily'], 'data/daily')
          download(c['nifty_indices_minute'], 'data/market')
          PY
      - name: Audit data
        run: python scripts/audit_data.py
      - name: Run leakage-safe strategy tournament
        run: python src/research_v2.py --config config/btst.yaml
      - name: Upload research results
        uses: actions/upload-artifact@v4
        with:
          name: btst-strategy-results
          path: |
            docs/strategy_leaderboard.csv
            docs/strategy_leaderboard.json
            docs/oos_trades.csv
            docs/research_manifest.json
            docs/data_audit.json
