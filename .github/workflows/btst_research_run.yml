name: BTST Strategy Research Run

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: btst-research
  cancel-in-progress: true

# Artifact publishing uses fetch/rebase/retry so concurrent main-branch updates do not
# invalidate a completed research run with a non-fast-forward push failure.

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preflight syntax and unit tests
        run: |
          python -m compileall -q src scripts tests
          pytest -q

      - name: Download daily and market data
        run: |
          python - <<'PY'
          import yaml
          from scripts.download_data import download
          cfg = yaml.safe_load(open('config/btst.yaml'))['data']['kaggle']
          download(cfg['nifty50_daily'], 'data/daily')
          download(cfg['nifty_indices_minute'], 'data/market')
          PY

      - name: Audit data
        run: python scripts/audit_data.py

      - name: Corporate action audit
        run: python src/corporate_action_audit.py

      - name: Validate data audit schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          with open('docs/data_audit.json', encoding='utf-8') as f:
              audit = json.load(f)
          for name in ('daily', 'market'):
              section = audit[name]
              assert section['usable_files'] > 0, f'No usable {name} files'
              assert section['min_date'] != 'None' and section['max_date'] != 'None', f'Missing {name} date range'
              q = section['quality_checks']
              required = {'duplicate_date_rows', 'invalid_ohlc_rows', 'extreme_close_return_rows_gt_50pct', 'extreme_return_symbols', 'zero_or_negative_volume_rows', 'volume_rows'}
              assert required.issubset(q), f'Incomplete {name} quality diagnostics'
          assert audit['daily']['quality_checks']['invalid_ohlc_rows'] == 0, (
              'Invalid OHLC rows detected in daily stock data: '
              f"{audit['daily']['quality_checks']['invalid_ohlc_rows']}"
          )
          ca = Path('docs/corporate_action_audit.json')
          assert ca.is_file() and ca.stat().st_size > 0, 'Missing corporate action audit'
          with ca.open(encoding='utf-8') as f:
              corporate = json.load(f)
          assert corporate.get('usable_files', 0) > 0, 'No usable files in corporate action audit'
          assert 'results' in corporate, 'Corporate action audit results missing'
          print(json.dumps(audit, indent=2))
          print(json.dumps({k: v for k, v in corporate.items() if k != 'results'}, indent=2))
          PY

      - name: Run leakage-safe strategy tournament
        run: python src/research_v2.py --config config/btst.yaml

      - name: Forensic trade and benchmark audit
        run: PYTHONPATH=. python scripts/forensic_audit.py

      - name: Validate research artifacts
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          required = [
              'docs/strategy_leaderboard.csv',
              'docs/strategy_leaderboard.json',
              'docs/oos_trades.csv',
              'docs/research_manifest.json',
              'docs/forensic_audit.json',
              'docs/data_audit.json',
              'docs/corporate_action_audit.json',
          ]
          for p in required:
              assert Path(p).is_file() and Path(p).stat().st_size > 0, f'Missing/empty artifact: {p}'
          lb = pd.read_csv('docs/strategy_leaderboard.csv')
          assert not lb.empty, 'Leaderboard is empty'
          assert {'strategy', 'trades', 'total_return', 'sharpe', 'max_drawdown', 'score', 'eligible'}.issubset(lb.columns)
          assert lb['trades'].ge(0).all()
          assert lb[['total_return', 'sharpe', 'max_drawdown', 'score']].notna().all().all()
          with open('docs/research_manifest.json', encoding='utf-8') as f:
              manifest = json.load(f)
          with open('docs/forensic_audit.json', encoding='utf-8') as f:
              forensic = json.load(f)
          with open('docs/data_audit.json', encoding='utf-8') as f:
              data_audit = json.load(f)
          assert manifest.get('symbols_tested', 0) > 0
          assert manifest.get('date_start') and manifest.get('date_end')
          assert forensic.get('trade_sanity', {}).get('finite_returns') is True
          assert forensic.get('trade_sanity', {}).get('max_gross_weight', 0) <= 1.0 + 1e-9
          assert 'quality_checks' in data_audit.get('daily', {})
          print(lb[['strategy', 'trades', 'total_return', 'sharpe', 'max_drawdown', 'score', 'eligible']].to_string(index=False))
          print(json.dumps(forensic['benchmarks'], indent=2))
          print(json.dumps(data_audit['daily']['quality_checks'], indent=2))
          PY

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: btst-strategy-results
          path: |
            docs/strategy_leaderboard.csv
            docs/strategy_leaderboard.json
            docs/oos_trades.csv
            docs/research_manifest.json
            docs/forensic_audit.json
            docs/data_audit.json
            docs/corporate_action_audit.json

      - name: Commit research artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/ config/btst.yaml
          if git diff --cached --quiet; then
            echo 'No research artifact changes to commit.'
            exit 0
          fi
          git commit -m 'Auto: BTST strategy research results'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Research artifacts pushed successfully on attempt ${attempt}."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying after refetch/rebase."
            git rebase --abort || true
          done
          echo 'Unable to push research artifacts after 3 attempts.'
          exit 1
