name: Unsupervised Pattern Research

on:
  workflow_dispatch:
  push:
    branches: [unsupervised-pattern-discovery-v9]
    paths-ignore:
      - 'docs/unsupervised_cluster_summary.csv'
      - 'docs/unsupervised_pattern_oos.csv'
      - 'docs/unsupervised_pattern_metrics.csv'

permissions:
  contents: write

jobs:
  pattern-research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download genuine intraday data
        run: python scripts/download_data.py
      - name: Verify intraday dataset
        run: |
          n=$(find data/intraday -type f -name '*.csv' | wc -l)
          echo "Intraday CSV files: $n"
          test "$n" -gt 0
      - name: Run unsupervised pattern discovery
        run: python src/unsupervised_pattern_research.py --config config/unsupervised_pattern.yaml
      - name: Validate artifacts
        run: |
          test -s docs/unsupervised_cluster_summary.csv
          test -s docs/unsupervised_pattern_oos.csv
          test -s docs/unsupervised_pattern_metrics.csv
          cat docs/unsupervised_pattern_metrics.csv
      - name: Publish compact results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/unsupervised_cluster_summary.csv docs/unsupervised_pattern_oos.csv docs/unsupervised_pattern_metrics.csv
          if git diff --cached --quiet; then echo 'No result changes'; else git commit -m 'Publish unsupervised pattern research results'; git push; fi
      - name: Upload pattern research
        uses: actions/upload-artifact@v4
        with:
          name: unsupervised-pattern-results
          path: |
            docs/unsupervised_cluster_summary.csv
            docs/unsupervised_pattern_oos.csv
            docs/unsupervised_pattern_metrics.csv
          retention-days: 30
