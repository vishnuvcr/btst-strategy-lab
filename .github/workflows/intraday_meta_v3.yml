name: Intraday Meta v3 Research
on:
  workflow_dispatch:
  push:
    branches: [intraday-unsupervised-meta]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Preflight
        run: |
          python -m py_compile src/intraday_meta_v3.py
          python -m py_compile src/intraday_meta_v3_event.py
      - name: Download genuine intraday data
        run: python scripts/download_data.py
      - name: Verify dataset
        run: test "$(find data/intraday -type f -name '*.csv' | wc -l)" -gt 0
      - name: Run leakage-safe event-driven v3 research
        run: python src/intraday_meta_v3_event.py --config config/intraday_meta_v2.yaml
      - name: Validate outputs
        run: |
          test -s docs/intraday_meta_v3_metrics.csv
          test -s docs/intraday_meta_v3_oos.csv
          test -s docs/intraday_meta_v3_folds.csv
          cat docs/intraday_meta_v3_metrics.csv
          python - <<'PY'
          import pandas as pd
          p=pd.read_csv('docs/intraday_meta_v3_metrics.csv')
          assert not p.empty
          assert (p['months_ge_30pct'] >= 0).all()
          print('Event-driven V3 validation passed.')
          PY
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: intraday-meta-v3-event-results
          path: docs/intraday_meta_v3_*.csv
          if-no-files-found: error
